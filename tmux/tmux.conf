# Rebind prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable vi keys in copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g mouse on
set -g history-limit 10000

# Advertise true-color support to applications running inside tmux.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Navigate panes using the same keys as Neovim.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes, repeatable after the prefix.
bind -r H resize-pane -L 1
bind -r J resize-pane -D 1
bind -r K resize-pane -U 1
bind -r L resize-pane -R 1

# Change base index for panes and windows to 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
