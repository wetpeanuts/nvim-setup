# Rebind prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable vi keys in copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g mouse on
set -g history-limit 10000

# Advertise true-color support to applications running inside tmux.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Navigate panes using the same keys as Neovim.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes, repeatable after the prefix.
bind -r H resize-pane -L 1
bind -r J resize-pane -D 1
bind -r K resize-pane -U 1
bind -r L resize-pane -R 1

# Change base index for panes and windows to 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Panes and windows ─────────────────────────────────────────────────
# Prefix + | splits left/right and Prefix + - splits top/bottom, in the current directory
# (- replaces the default delete-buffer key; % and " keep working)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
# New windows open in the current directory too
bind c new-window -c "#{pane_current_path}"

# Wait only 0 ms after Esc
set -s escape-time 0

# ── Plugins (TPM) ─────────────────────────────────────────────────────
# Plugins, managed by TPM. After the first start press Prefix + I (capital i)
# to install them; Prefix + U updates them
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'Morantron/tmux-fingers'
# Install TPM and the plugins automatically the first time tmux starts
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
# Keep this line at the very bottom of the file
run '~/.tmux/plugins/tpm/tpm'
